name: Post to X

on:
  schedule:
    # Cron is in UTC (IST minus 5:30). The bot checks twice an hour from 6:47 PM to
    # 12:17 AM IST and only posts on a posting day, after that day's random time
    # (see config.POST_EVERY_DAYS and config.WINDOWS).
    # Odd minutes on purpose: GitHub drops many runs scheduled at :00 and :30.
    - cron: "17,47 13-18 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = show the tweet without posting, post-now = post immediately, learn-now = update the weekly report and pillar weights"
        type: choice
        options: [dry-run, post-now, learn-now]
        default: dry-run

permissions:
  contents: write  # lets the bot save data/ (history, learned weights, weekly report)

concurrency:
  group: post-to-x  # never two runs at once, so no double posts
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install text-shaping libraries (for Hindi/Urdu cards)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libraqm0 libfribidi0

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Run the bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          SCHEDULE_SEED: ${{ secrets.SCHEDULE_SEED }}
          DRY_RUN: ${{ github.event.inputs.mode == 'dry-run' }}
          FORCE: ${{ github.event.inputs.mode == 'dry-run' || github.event.inputs.mode == 'post-now' }}
          LEARN_ONLY: ${{ github.event.inputs.mode == 'learn-now' }}
        run: python bot.py

      - name: Save image preview (dry runs)
        if: github.event.inputs.mode == 'dry-run'
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: preview/
          if-no-files-found: ignore

      - name: Save post history, weights and report
        if: github.event.inputs.mode != 'dry-run'
        run: |
          git config user.name "x-bot"
          git config user.email "x-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "Nothing new to save."; exit 0; fi
          git commit -m "Log post"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
