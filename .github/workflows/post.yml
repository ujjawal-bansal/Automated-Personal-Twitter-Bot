name: Daily personal post
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Daily run, private shadow evaluation, or metrics collection
        options: [dry-run, auto, learn-now]
        default: dry-run
permissions:
  contents: write
concurrency:
  group: personal-x-publisher
  cancel-in-progress: false
jobs:
  daily:
    if: vars.AGENT_ENABLED == 'true' || github.event.inputs.mode == 'dry-run'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          AGENT_ENABLED: ${{ vars.AGENT_ENABLED }}
          X_ACCOUNT_ID: '1703345238167924736'
          AGENT_STATE_KEY: ${{ secrets.AGENT_STATE_KEY }}
          POST_START_HOUR: ${{ vars.POST_START_HOUR || '12' }}
          POST_END_HOUR: ${{ vars.POST_END_HOUR || '16' }}
          AGENT_COMMONS_IMAGES: ${{ vars.AGENT_COMMONS_IMAGES }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          SCHEDULE_SEED: ${{ secrets.SCHEDULE_SEED }}
          DRY_RUN: ${{ github.event.inputs.mode == 'dry-run' }}
          LEARN_ONLY: ${{ github.event.inputs.mode == 'learn-now' }}
